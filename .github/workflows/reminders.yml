name: Promemoria eventi

# Vercel (piano gratuito) non permette cron più frequenti di uno al giorno: questo workflow chiama
# ogni 5 minuti la route che invia su Telegram l'avviso 30 minuti prima di ogni evento.
# GitHub può ritardare i cron di qualche minuto: la route avvisa al primo giro utile e non duplica.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Controlla gli eventi in arrivo
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 45 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://second-brain-rho-neon.vercel.app/api/cron/reminders"
